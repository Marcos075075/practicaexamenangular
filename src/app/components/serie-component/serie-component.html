<main class="page-shell">
  <section class="series-detail surface">
    <img class="series-poster" [src]="serie.imagen" [alt]="serie.nombre">
    <div>
      <p class="eyebrow">Serie</p>
      <h1>{{serie.nombre}}</h1>
      <div class="rating mb-4"><span>★</span> {{serie.puntuacion}} <small>/ 10</small></div>
      <a [routerLink]="['/personajes', serie.idSerie]" class="btn btn-primary">Ver personajes</a>
    </div>
  </section>
</main>
